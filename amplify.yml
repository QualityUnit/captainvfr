version: 1
env:
  variables:
    # Hugo version - this works with AWS Amplify Live Package Updates
    HUGO_VERSION: 0.146.5
    # SafeSky API Key - Set this in Amplify Console Environment Variables
    # SAFESKY_API_KEY: (set in Amplify Console for security)
frontend:
  phases:
    preBuild:
      commands:
        # Deploy/Update Lambda function for SafeSky proxy (must be in frontend phase for Gen 1)
        - echo "========== Starting SafeSky Lambda Deployment =========="
        - echo "AWS Region: eu-central-1"
        - export AWS_REGION=eu-central-1
        - export AWS_DEFAULT_REGION=eu-central-1
        - echo "Checking AWS credentials..."
        - aws sts get-caller-identity || echo "No AWS credentials available"
        - echo "Making deployment script executable..."
        - chmod +x backend/lambda/safesky-proxy/amplify-deploy.sh
        - echo "Running deployment script..."
        - ./backend/lambda/safesky-proxy/amplify-deploy.sh || echo "WARNING: Lambda deployment failed but continuing build"
        - echo "========== SafeSky Lambda Deployment Complete =========="
        
        # Continue with regular Hugo build
        # Download and install Git LFS binary directly
        - wget https://github.com/git-lfs/git-lfs/releases/download/v3.4.0/git-lfs-linux-amd64-v3.4.0.tar.gz
        - tar -xzf git-lfs-linux-amd64-v3.4.0.tar.gz
        - ./git-lfs-3.4.0/git-lfs install --local
        
        # Pull large files
        - ./git-lfs-3.4.0/git-lfs pull
        
        # Hugo Extended is now provided by AWS Amplify via Live Package Updates
        - hugo version
        
        # Install Node.js dependencies for Hugo site
        - cd hugo
        - npm ci
    build:
      commands:
        # Build the Hugo static site (we're already in hugo directory from preBuild)
        - echo "Building Hugo site..."
        - npm run build
        
        # The Flutter web app should already be in static/app (built locally and committed)
  artifacts:
    # Base directory is hugo/public which contains both the website and the app
    baseDirectory: hugo/public
    files:
      - '**/*'
  cache:
    paths:
      - hugo/node_modules/**/*
      
# Custom headers for better performance and security
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.{jpg,jpeg,png,webp,svg,ico}'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/app/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
