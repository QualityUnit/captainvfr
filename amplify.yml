version: 1
env:
  variables:
    # Hugo version - using a valid Extended version
    HUGO_VERSION: 0.121.2
    # Increase Node.js memory limit for build
    NODE_OPTIONS: --max-old-space-size=4096
    # SafeSky API Key - Set this in Amplify Console Environment Variables
    # SAFESKY_API_KEY: (set in Amplify Console for security)
backend:
  phases:
    preBuild:
      commands:
        # Deploy/Update Lambda function for SafeSky proxy
        - echo "Deploying SafeSky Lambda function..."
        - export AWS_PROFILE=default
        - export AWS_REGION=eu-central-1
        - chmod +x backend/lambda/safesky-proxy/amplify-deploy.sh
        - ./backend/lambda/safesky-proxy/amplify-deploy.sh
frontend:
  phases:
    preBuild:
      commands:
        # Download and install Git LFS binary directly
        - wget https://github.com/git-lfs/git-lfs/releases/download/v3.4.0/git-lfs-linux-amd64-v3.4.0.tar.gz
        - tar -xzf git-lfs-linux-amd64-v3.4.0.tar.gz
        - ./git-lfs-3.4.0/git-lfs install --local
        
        # Pull large files
        - ./git-lfs-3.4.0/git-lfs pull
        
        # Hugo Extended is now provided by AWS Amplify via Live Package Updates
        - hugo version
        
        # Install Node.js dependencies for Hugo site
        - cd hugo && npm ci
    build:
      commands:
        # Build the Hugo static site (explicitly cd into hugo directory)
        - echo "Building Hugo site..."
        - cd hugo && npm run build
        
        # The Flutter web app should already be in static/app (built locally and committed)
  artifacts:
    # Base directory is hugo/public which contains both the website and the app
    baseDirectory: hugo/public
    files:
      - '**/*'
  cache:
    paths:
      - hugo/node_modules/**/*
      
# Custom headers for better performance and security
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.{jpg,jpeg,png,webp,svg,ico}'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/app/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
